# The console deploys into the CUSTOMER's own Cloudflare account and is reached on a
# custom domain only (no *.workers.dev). It serves a static SPA and proxies nothing to
# the vendor; the SPA calls the in-account engine admin API directly.
# RENAMING THIS WORKER: set CONSOLE_WORKER_NAME in the ENGINE'S wrangler.toml to the same name. Without
# it, a console update the engine applies targets "downpipe-console", not this worker.
name = "downpipe-console"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
workers_dev = false

# Upload source maps so production stack traces map back to TypeScript.
upload_source_maps = true

# The console serves a static SPA and proxies same-origin to the engine; it does no heavy
# compute, so cap CPU low to bound a runaway path.
limits = { cpu_ms = 50 }

# The permanent custom domain (no *.workers.dev).
route = { pattern = "console.downpipes.io", custom_domain = true }

# Workers Logs and per-request metrics, so console requests are observable without an
# external sink.
[observability]
enabled = true

# The one topology: the console reaches the engine over a worker-to-worker service
# binding and proxies /admin/* and /support/* same-origin. The engine needs NO public
# hostname at all (its cron and Durable Objects run without one), the public surface
# is THIS one domain, and the CSP connect-src is 'self'.
# RENAMING THE ENGINE WORKER: `service` below is the engine's worker name, so set it to the new name as
# well (the engine's wrangler.toml lists every place). Miss it and this deploy is refused with "Service
# binding 'ENGINE' references Worker 'downpipe-engine' which was not found [code: 10143]".
[[services]]
binding = "ENGINE"
service = "downpipe-engine"

[assets]
directory = "public"
binding = "ASSETS"
# Run the Worker before serving any asset so every response (including /, app.js and tokens.css)
# carries the strict security headers from worker.ts. Without this the edge serves matched assets
# directly and the SPA entry document ships with no Content-Security-Policy.
run_worker_first = true
