# Static analysis (SAST) with Semgrep, advisory. It surfaces findings on every push
# and pull request to main and does NOT block merge (the `|| true` keeps it green).
# Findings ride as a downloadable SARIF artefact, and to the Security tab when Advanced Security is on.
# Promote it to a hard gate by removing `|| true` and adding it to the ci-success
# needs list once the baseline is triaged. The semgrep version is pinned (==1.167.0) for reproducibility.
name: Semgrep

on:
  # No push trigger: 82 push runs in ten days of September, each about 3 billed minutes,
  # re-scanning main for what the pull request run and the weekly schedule already cover.
  pull_request:
    branches: [main]
    paths-ignore: ["LICENSE*", ".gitignore"]
  schedule:
    # Weekly re-scan so newly published rules surface against an unchanged tree.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF results to the Security tab. Advisory only: this job never
      # blocks merge and is not in the ci-success needs list.
      security-events: write
      # `actions: read` is required by upload-sarif on a PRIVATE repository, and its absence is what
      # produced the exact annotation text this job used to carry every run, "Resource not accessible
      # by integration", pointing at the get-a-workflow-run endpoint. That message was read here as
      # proof that Advanced Security was missing; it was not, it was this permission. Measured against
      # docs, whose trivy and semgrep jobs already carry `actions: read` and therefore reach the real
      # answer, "Code Security must be enabled for this repository to use code scanning". Both roads
      # end at the same place today, because code scanning is off either way, so this line changes
      # nothing now. It is here so that the day the upload is meant to work it is not stopped by a
      # permission nobody remembered.
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - name: Semgrep scan (rules p/default + p/secrets)
        run: |
          pipx install semgrep==1.167.0
          semgrep scan --config p/default --config p/secrets --metrics off --sarif --output semgrep.sarif || true
      # WHY THIS UPLOAD IS SKIPPED RATHER THAN ALLOWED TO FAIL.
      #
      # Code scanning ingest needs GitHub Advanced Security, which this private repository does not
      # have. `GET /repos/downpipes-io/console` reports `security_and_analysis.code_security.status` as
      # `disabled`, and so does every one of the ten repositories in the organisation. So the upload
      # cannot succeed here, and it was `continue-on-error` that kept the job green over it.
      #
      # That was not a quiet arrangement, which is the part the previous note here had wrong. A step
      # held green by `continue-on-error` STILL emits a failure-level annotation, so every successful
      # Semgrep run on main carried one. Read from run 31251868234 on main at 22f7687f, conclusion
      # success, job conclusion success, annotation level failure, via
      # `GET /repos/downpipes-io/console/check-runs/{job_id}/annotations`. It was measured separately that
      # a step failing under `continue-on-error` annotates at failure level even with no error command
      # of its own, and that a step held back by an `if:` annotates nothing at all. A green run that
      # always shows a red annotation teaches a reader that annotations here mean nothing, which is the
      # same lesson a permanently red check teaches and the last one a security job should be teaching.
      #
      # The precondition is the repository's own visibility, so it is written as the visibility test
      # that decides it. That is not a new construct: `scorecard.yml` in this repository already guards
      # its own upload-sarif this way, and the dependency-review jobs in engine, docs and control-plane
      # guard themselves the same way. Advanced Security is included once a repository is public, so
      # this step starts running again by itself the day that changes, with nothing to edit here.
      # Enabling Advanced Security on the private repository is the other route to the same thing, and
      # that is an owner setting rather than a default; taking it would mean widening this condition.
      #
      # `continue-on-error` goes with the same edit, and that half is what keeps this honest rather
      # than merely quiet. A skipped step reports nothing, so the only runs on which this step can now
      # fail are runs where it was expected to work, and on those the job goes red and says so.
      #
      # Written as `== false` rather than `!`: on an event whose payload carries no repository object
      # the expression is null, and `== false` skips where `!null` would run.
      - name: Upload SARIF to the Security tab (only where code scanning can accept it)
        uses: github/codeql-action/upload-sarif@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v3.30.0
        if: always() && github.event.repository.private == false
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # The skip must not be silent. Perversely, the failure-level annotation was until now the only
      # thing in a run that said the Security tab had received nothing, so removing it without putting
      # something in its place would leave a reader with no way to tell an empty Security tab from a
      # clean one. This says which of the two happened, at notice level, in the log and the summary.
      - name: State where the SARIF went
        if: always()
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "${IS_PRIVATE}" = "false" ]; then
            msg="SARIF was uploaded to the Security tab, and is attached to this run as the semgrep-sarif artefact."
          else
            msg="SARIF was NOT uploaded to the Security tab: code scanning ingest needs Advanced Security, which this private repository does not have. The findings are in the semgrep-sarif artefact on this run."
            echo "::notice::${msg}"
          fi
          { echo "### SARIF destination"; echo ""; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"

      # The findings stay reachable without the Security tab: downloadable from the run.
      - name: Upload SARIF as an artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
