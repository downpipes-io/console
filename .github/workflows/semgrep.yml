# Static analysis (SAST) with Semgrep, advisory. It surfaces findings on every push
# and pull request to main and does NOT block merge (the `|| true` keeps it green).
# Findings ride as a downloadable SARIF artefact, and to the Security tab when Advanced Security is on.
# Promote it to a hard gate by removing `|| true` and adding it to the ci-success
# needs list once the baseline is triaged. The semgrep version is pinned (==1.167.0) for reproducibility.
name: Semgrep

on:
  # No push trigger: a push run, about 3 billed minutes, would re-scan main for what the pull
  # request run and the weekly schedule already cover.
  pull_request:
    branches: [main]
    paths-ignore: ["LICENSE*", ".gitignore"]
  schedule:
    # Weekly re-scan so newly published rules surface against an unchanged tree.
    - cron: "23 18 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF results to the Security tab. Advisory only: this job never
      # blocks merge and is not in the ci-success needs list.
      security-events: write
      # `actions: read` is required by upload-sarif on a PRIVATE repository. Without it the upload
      # reports "Resource not accessible by integration" at the get-a-workflow-run endpoint, which reads
      # as missing Advanced Security but is this permission. With it, the real answer is "Code Security
      # must be enabled for this repository to use code scanning". It is here so that an upload that is
      # meant to work is not stopped by a permission nobody remembered.
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Semgrep scan (rules p/default + p/secrets)
        run: |
          pipx install semgrep==1.167.0
          semgrep scan --config p/default --config p/secrets --exclude public/app.js --metrics off --sarif --output semgrep.sarif || true
      # WHY THIS UPLOAD IS SKIPPED RATHER THAN ALLOWED TO FAIL.
      #
      # Code scanning ingest needs GitHub Advanced Security, which a private repository does not
      # have unless the owner enables it. So on a private repository the upload cannot succeed,
      # and `continue-on-error` would only hold the job green over it.
      #
      # A step held green by `continue-on-error` STILL emits a failure-level annotation, so every
      # successful Semgrep run on main would carry one (job conclusion success, annotation level failure,
      # visible via `GET /repos/downpipes-io/console/check-runs/{job_id}/annotations`). A step failing under
      # `continue-on-error` annotates at failure level even with no error command of its own, and a step
      # held back by an `if:` annotates nothing at all. A green run that
      # always shows a red annotation teaches a reader that annotations here mean nothing, which is the
      # same lesson a permanently red check teaches and the last one a security job should be teaching.
      #
      # The precondition is the repository's own visibility, so it is written as the visibility test
      # that decides it. `scorecard.yml` in this repository guards its own upload-sarif this way,
      # and the dependency-review jobs in engine and docs guard themselves the same way. Advanced Security
      # is included on a public repository, so this step runs there, with nothing to edit here. Enabling
      # Advanced Security on a private repository is the other route to the same thing, and that is an
      # owner setting rather than a default; taking it would mean widening this condition.
      #
      # `continue-on-error` is absent, and that is what keeps this honest rather
      # than merely quiet. A skipped step reports nothing, so the only runs on which this step can
      # fail are runs where it was expected to work, and on those the job goes red and says so.
      #
      # Written as `== false` rather than `!`: on an event whose payload carries no repository object
      # the expression is null, and `== false` skips where `!null` would run.
      - name: Upload SARIF to the Security tab (only where code scanning can accept it)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event.repository.private == false
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # The skip must not be silent. Without a failure-level annotation, nothing in a run says the
      # Security tab received nothing, so a reader could not tell an empty Security tab from a
      # clean one. This says which of the two happened, at notice level, in the log and the summary.
      - name: State where the SARIF went
        if: always()
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "${IS_PRIVATE}" = "false" ]; then
            msg="SARIF was uploaded to the Security tab, and is attached to this run as the semgrep-sarif artefact."
          else
            msg="SARIF was NOT uploaded to the Security tab: code scanning ingest needs Advanced Security, which this private repository does not have. The findings are in the semgrep-sarif artefact on this run."
            echo "::notice::${msg}"
          fi
          { echo "### SARIF destination"; echo ""; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"

      # The findings stay reachable without the Security tab: downloadable from the run.
      - name: Upload SARIF as an artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
