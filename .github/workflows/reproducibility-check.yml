# Console twin of the engine repo's reproducibility check: build the release bundle twice
# on each of two runner images, from two different working paths, and fail on any digest
# drift. The console's committed public/ bundle also has its own byte-compare drift guard
# (test/validate-bundle.ts); this check covers the full packaged release artefact around it
# (the Worker via wrangler dry-run, the asset walk and the JSON envelope).
name: Reproducibility check

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/reproducibility-check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/reproducibility-check.yml"
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  rebuild-and-compare:
    name: Build twice, two paths (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with: { egress-policy: audit }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Build A (workspace path)
        run: |
          set -euo pipefail
          npm ci
          node scripts/build-release-bundle.mjs --allow-dirty --out "${RUNNER_TEMP}/a.json" > "${RUNNER_TEMP}/a-facts.json"
          cat "${RUNNER_TEMP}/a-facts.json"
      - name: Build B (fresh clone at a different path)
        run: |
          set -euo pipefail
          git clone --quiet "file://${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/repro-b"
          cd "${RUNNER_TEMP}/repro-b"
          npm ci
          node scripts/build-release-bundle.mjs --allow-dirty --out "${RUNNER_TEMP}/b.json" > "${RUNNER_TEMP}/b-facts.json"
          cat "${RUNNER_TEMP}/b-facts.json"
      - name: Compare
        run: |
          set -euo pipefail
          A=$(node -p "require('${RUNNER_TEMP}/a-facts.json').sha384")
          B=$(node -p "require('${RUNNER_TEMP}/b-facts.json').sha384")
          echo "A: $A"
          echo "B: $B"
          if ! cmp -s "${RUNNER_TEMP}/a.json" "${RUNNER_TEMP}/b.json"; then
            echo "::error::console release bundle is NOT reproducible on ${{ matrix.os }}: the same commit produced different bytes from two paths."
            exit 1
          fi
          [ "$A" = "$B" ]
          echo "reproducible on ${{ matrix.os }}: $A"
