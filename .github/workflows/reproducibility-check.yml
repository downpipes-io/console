# Reproducibility check (DP-B), console twin of the engine repo's workflow: build the release
# bundle twice on each of two runner images, from two different working paths, and fail on any
# digest drift. The console's committed public/ bundle already has its own byte-compare drift
# guard (test/validate-bundle.ts); this check covers the full packaged release artefact around
# it (shell worker via wrangler dry-run + the asset walk + the JSON envelope).
name: Reproducibility check

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/reproducibility-check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/reproducibility-check.yml"
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  rebuild-and-compare:
    name: Build twice, two paths (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Build A (workspace path)
        run: |
          set -euo pipefail
          npm ci
          node scripts/build-release-bundle.mjs --allow-dirty --out "${RUNNER_TEMP}/a.json" > "${RUNNER_TEMP}/a-facts.json"
          cat "${RUNNER_TEMP}/a-facts.json"
      - name: Build B (fresh clone at a different path)
        run: |
          set -euo pipefail
          git clone --quiet "file://${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/repro-b"
          cd "${RUNNER_TEMP}/repro-b"
          npm ci
          node scripts/build-release-bundle.mjs --allow-dirty --out "${RUNNER_TEMP}/b.json" > "${RUNNER_TEMP}/b-facts.json"
          cat "${RUNNER_TEMP}/b-facts.json"
      - name: Compare
        run: |
          set -euo pipefail
          A=$(node -p "require('${RUNNER_TEMP}/a-facts.json').sha384")
          B=$(node -p "require('${RUNNER_TEMP}/b-facts.json').sha384")
          echo "A: $A"
          echo "B: $B"
          if ! cmp -s "${RUNNER_TEMP}/a.json" "${RUNNER_TEMP}/b.json"; then
            echo "::error::console release bundle is NOT reproducible on ${{ matrix.os }}: the same commit produced different bytes from two paths. Do not publish a channel from this commit; find the drift first."
            exit 1
          fi
          [ "$A" = "$B" ]
          echo "reproducible on ${{ matrix.os }}: $A"
