# Tag-triggered ATTESTED release artefacts for the console (DP-A), the console half of the
# dual-root release model the engine repo's release.yml documents in full. CI builds the
# downpipe-console-bundle/1 artefact deterministically (scripts/build-release-bundle.mjs, which
# must stay byte-identical to the vendor publisher's packaging; the ceremony's digest check is
# what holds the two together) and attests it publicly: cosign keyless signatures (Rekor-logged,
# identity = this workflow) plus SLSA Build L3 provenance. CI holds no Cloudflare credential and
# no signing key; the offline hybrid release key at the owner's desk is the only thing that can
# put this artefact on the update channel, and it refuses bytes this workflow did not attest.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify-tag:
    name: Verify the release tag signature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify the tag against the signer roster committed on main
        # Roster from origin/main, never the tag's own tree (a pushed tag must not vouch for
        # itself); see the engine release.yml twin for the full rationale.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The checkout above is a full one (fetch-depth 0), so origin/main is already here; a
          # second fetch would need credentials the checkout deliberately does not persist
          # (persist-credentials false), and on a private repository it fails with "could not
          # read Username", which is what stopped the first attested cut.
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main is missing from the checkout; the roster cannot be read"; exit 1; }
          git show origin/main:.github/allowed_signers > "${RUNNER_TEMP}/allowed_signers"
          if ! grep -qE '^[^#[:space:]]' "${RUNNER_TEMP}/allowed_signers"; then
            echo "::error::.github/allowed_signers on main carries no signer entries yet; add the release-signing SSH public key (see the comment at the top of that file) before cutting an attested release."
            exit 1
          fi
          git -c gpg.ssh.allowedSignersFile="${RUNNER_TEMP}/allowed_signers" verify-tag "$TAG"
      - name: Tag must equal the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG; a channel must never name bytes built from a different version than the tag says."
            exit 1
          fi

  build:
    name: Deterministic bundle build
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      version: ${{ steps.facts.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci
      - name: Build the console release bundle (deterministic)
        id: facts
        run: |
          set -euo pipefail
          node scripts/build-release-bundle.mjs > release-facts.json
          cat release-facts.json
          echo "version=$(node -p "require('./release-facts.json').version")" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM (runtime deps)
        run: bash scripts/generate-sbom.sh
      - name: Canonical sums manifest
        env:
          VERSION: ${{ steps.facts.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum "dist/console-${VERSION}.json" release-facts.json sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Export subject hashes for SLSA
        id: hash
        run: echo "hashes=$(base64 -w0 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload the release tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-release-${{ steps.facts.outputs.version }}
          path: |
            dist/console-${{ steps.facts.outputs.version }}.json
            release-facts.json
            sbom.cdx.json
            SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

  sign:
    name: Cosign keyless signatures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Fulcio keyless identity for THIS workflow; every signature lands in Rekor
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "console-release-${{ needs.build.outputs.version }}" }
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every release file, then verify what was minted
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for f in "dist/console-${VERSION}.json" SHA256SUMS.txt release-facts.json sbom.cdx.json; do
            cosign sign-blob --yes --bundle "$(basename "$f").cosign-bundle" "$f"
          done
          for f in "dist/console-${VERSION}.json" SHA256SUMS.txt release-facts.json sbom.cdx.json; do
            cosign verify-blob --bundle "$(basename "$f").cosign-bundle" \
              --certificate-identity-regexp "^https://github.com/downpipes-io/console/\.github/workflows/release\.yml@refs/tags/v" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$f"
          done
      - name: Upload cosign bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-cosign-${{ needs.build.outputs.version }}
          path: "*.cosign-bundle"
          retention-days: 90
          if-no-files-found: error

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # PINNING EXCEPTION (recorded): the SLSA generator must be pinned by TAG, not commit SHA; the
    # slsa-verifier refuses provenance minted from a SHA-pinned generator ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false
      provenance-name: console.intoto.jsonl

  release:
    name: GitHub release
    needs: [build, sign, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with: { egress-policy: audit }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "console-release-${{ needs.build.outputs.version }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "console-cosign-${{ needs.build.outputs.version }}" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "console.intoto.jsonl" }
      - name: Create the release with the full verification set
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "console $TAG" \
            --notes "Attested console release bundle for the update channel. Verify locally: cosign verify-blob --bundle <file>.cosign-bundle <file>; slsa-verifier verify-artifact dist/console-${VERSION}.json --provenance-path console.intoto.jsonl --source-uri github.com/downpipes-io/console. The owner ceremony republishes this whole set at update.downpipes.io/provenance/<release-version>/ so customers verify from the channel without GitHub access." \
            "dist/console-${VERSION}.json" release-facts.json sbom.cdx.json SHA256SUMS.txt *.cosign-bundle console.intoto.jsonl
